services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/backend/instance/phishing.db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      MODEL_VERSION: ${MODEL_VERSION:-v1.1.0}
      # Trust Cloudflare / nginx proxy headers when deploying online
      PREFERRED_URL_SCHEME: https
    volumes:
      - app_data:/app/backend/instance
      - ./ml/models/artifacts:/app/ml/models/artifacts:ro
      - ./backend/data:/app/backend/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  app_data:
