{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-shell panel">
  <div class="auth-brand">
    <a class="brand" href="{{ url_for('main.landing') }}">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v6c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7l8-4z"/></svg>
      </span>
      <span class="brand-name">PhishGuard</span>
    </a>
  </div>
  <h1 class="page-title" style="text-align:center;">Welcome back</h1>
  <form class="form" method="post" style="max-width:none;">
    {% include "_csrf.html" %}
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
  <div class="auth-divider">or</div>
  <p class="muted" style="text-align:center;margin:0;font-size:0.88rem;">
    Google sign-in will connect here when Gmail OAuth is configured for your deployment.
  </p>
  <p class="muted" style="margin-top:1.25rem;text-align:center;">
    Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
  </p>
</div>
{% endblock %}
