{% extends "base.html" %}
{% block title %}Email Scanner{% endblock %}
{% block content %}
<h1 class="page-title">Email analysis</h1>
<p class="muted" style="margin-top:-0.75rem;margin-bottom:1.25rem;">
  Paste headers and body, or upload a <code>.eml</code> file. Content is analysed in memory and not stored by default.
</p>

<section class="panel">
  <form class="form wide" method="post" enctype="multipart/form-data">
    {% include "_csrf.html" %}
    <label>From / subject / body
      <textarea name="email_text" placeholder="From: security@example.com&#10;Subject: Your account requires verification&#10;&#10;Your account has been suspended. Click here to verify…">{{ email_text or '' }}</textarea>
    </label>
    <label>Or upload .eml
      <input type="file" name="eml_file" accept=".eml,message/rfc822,text/plain">
    </label>
    <button class="btn btn-primary" type="submit">Analyze email</button>
  </form>
</section>
{% endblock %}
