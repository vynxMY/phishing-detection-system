# Nginx reverse proxy — TLS termination at Cloudflare or local certs
upstream phishing_app {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    # Security headers (also set by app; defence in depth)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /health {
        proxy_pass http://phishing_app/api/v1/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://phishing_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

